# fer_hand_mjc: the MuJoCo simulation. Positions in metres, in the MuJoCo world frame.
# Lists must be floats (write 0.0, not 0), or the parameter type check fails.
fer_hand_mjc:
  ros__parameters:
    model_path: ''                # empty: share/fer_hand_mjc/models/hand_scene.xml
    body_name: hand
    commanded_bodies: [tracker]   # moved only by /hand_mjc/<body>/command (fer_track_hand)
    frame_id: world
    publish_rate_hz: 100.0
    viewer: true                  # false: headless (no window)
    motion: sine                  # static | sine | random; /hand_mjc/target overrides it
    start_position: [0.5, 0.0, 0.5]
    sine_amplitude: [0.1, 0.3, 0.15]  # sine: +- around start_position
    sine_frequency: 0.08              # sine: Hz (peak hand speed ~0.18 m/s)
    random_range: [0.25, 0.35, 0.2]   # random: waypoints within start_position +- this
    random_speed: 0.1                 # random: m/s
    random_seed: 0                    # random: same seed, same path
