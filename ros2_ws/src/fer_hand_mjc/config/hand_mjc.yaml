# fer_hand_mjc: the MuJoCo simulation. Positions in metres, in the MuJoCo world frame.
# Lists must be floats (write 0.0, not 0), or the parameter type check fails.
fer_hand_mjc:
  ros__parameters:
    model_path: ''                # empty: share/fer_hand_mjc/models/hand_scene.xml
    body_name: hand
    frame_id: world               # hand_mjc.launch.py links it to the robot (parent_frame)
    publish_rate_hz: 100.0
    viewer: true                  # false: headless (no window)
    motion: sine                  # static | sine | random; /hand_mjc/target overrides it
    # Handover height: the gripper, 10 cm above the hand, stays in the /motion/follow
    # workspace of fer_moveit (z <= 0.50).
    start_position: [0.45, 0.0, 0.35]
    sine_amplitude: [0.1, 0.25, 0.04] # sine: +- around start_position
    sine_frequency: 0.08              # sine: Hz (peak hand speed ~0.14 m/s)
    random_range: [0.1, 0.25, 0.04]   # random: waypoints within start_position +- this
    random_speed: 0.1                 # random: m/s
    random_seed: 0                    # random: same seed, same path
