fer_moveit_motion_server:
  ros__parameters:
    planning_time: 5.0                  # s, per plan
    planning_attempts: 1
    goal_position_tolerance: 0.001      # m, pose targets
    goal_orientation_tolerance: 0.01    # rad, pose targets
    rest_velocity: 0.01                 # rad/s, every joint below this = at rest
    rest_timeout: 3.0                   # s, wait for rest after a stop
    tf_timeout: 0.2                     # s
    world_model_timeout: 2.0            # s
    move_group_timeout: 7.0             # s, at least planning_time
    startup_timeout: 10.0               # s
    # /motion/follow: v = v_target + gain * (target - tcp), capped; caps scale with speed_scaling.
    follow_gain: 2.0                    # 1/s
    follow_max_speed: 0.25              # m/s at speed_scaling 1
    follow_rotation_gain: 2.0           # 1/s
    follow_max_rotation_speed: 0.5      # rad/s at speed_scaling 1
    follow_velocity_time_constant: 0.05 # s, low-pass of the target velocity estimate
    follow_feedback_period: 0.1         # s
    # Box in base Follow works in, away from singular regions; a goal outside it: the TCP holds.
    # MuJoCo, 6 Nov: every corner reached (far high ones slowed, 3-12 mm short); x 0.65 / z 0.55 halted.
    follow_workspace_min: [0.25, -0.30, 0.25]  # m
    follow_workspace_max: [0.60, 0.30, 0.50]   # m
    follow_halt_timeout: 1.0            # s, stream halted this long: end with UNREACHABLE

    # /motion/follow: MoveIt Servo, run as a library (adapters/servo_streamer).
    moveit_servo:
      move_group_name: fer_arm
      publish_period: 0.01              # s, one control cycle
      max_expected_latency: 0.1         # s, how far ahead each joint command reaches
      command_in_type: speed_units      # twists in m/s and rad/s
      scale: {linear: 0.25, rotational: 0.8, joint: 0.5}
      incoming_command_timeout: 0.1     # s
      command_out_type: trajectory_msgs/JointTrajectory
      command_out_topic: /effort_trajectory_controller/joint_trajectory
      publish_joint_positions: true
      publish_joint_velocities: false   # true: the JTC rejects every message (non-zero end velocity)
      publish_joint_accelerations: false
      joint_topic: /joint_states
      is_primary_planning_scene_monitor: false
      monitored_planning_scene_topic: /monitored_planning_scene
      use_smoothing: false              # true: the TCP covers only ~57 % of the commanded motion
      check_collisions: true
      collision_check_rate: 10.0        # Hz
      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      joint_limit_margins: [0.12]       # rad
