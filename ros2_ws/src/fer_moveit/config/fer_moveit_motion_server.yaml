fer_moveit_motion_server:
  ros__parameters:
    planning_time: 5.0                  # s, per plan
    planning_attempts: 1
    goal_position_tolerance: 0.001      # m, pose targets
    goal_orientation_tolerance: 0.01    # rad, pose targets
    rest_velocity: 0.01                 # rad/s, every joint below this = at rest
    rest_timeout: 3.0                   # s, wait for rest after a stop
    tf_timeout: 0.2                     # s
    world_model_timeout: 2.0            # s
    move_group_timeout: 7.0             # s, at least planning_time
    startup_timeout: 10.0               # s
    # /motion/follow: v = v_target + gain * (target - tcp), capped; caps scale with speed_scaling.
    follow_gain: 2.0                    # 1/s
    follow_max_speed: 0.25              # m/s at speed_scaling 1
    follow_rotation_gain: 2.0           # 1/s
    follow_max_rotation_speed: 0.5      # rad/s at speed_scaling 1
    follow_velocity_time_constant: 0.05 # s, low-pass of the target velocity estimate
    # Target velocity fed forward in full while the newest target sample is at most
    # follow_velocity_hold old, then faded to 0 over follow_velocity_fade (a tracker that stopped
    # sending must not carry the TCP on). Hold > the tracker's sample period + jitter.
    follow_velocity_hold: 0.05          # s
    follow_velocity_fade: 0.05          # s
    follow_feedback_period: 0.1         # s
    # Box in base Follow works in, away from singular regions; a goal outside it: the TCP holds.
    # MuJoCo, 6 Nov: every corner reached (far high ones slowed, 3-12 mm short); x 0.65 / z 0.55 halted.
    follow_workspace_min: [0.25, -0.30, 0.25]  # m
    follow_workspace_max: [0.60, 0.30, 0.50]   # m
    follow_halt_timeout: 1.0            # s, stream halted this long: end with UNREACHABLE
    # Stall watchdog: over follow_stall_window, the TCP progresses along the net commanded
    # displacement at < follow_stall_ratio of the commanded speed, for follow_stall_timeout: end
    # with UNREACHABLE. Catches what never reports a halt, e.g. Servo slowing down towards a
    # singularity. Net commands below follow_stall_min_speed are not judged (0.03 m/s = 1.5 cm
    # error to a still goal at gain 2/s; a waving hand nets out to about zero).
    follow_stall_window: 0.5            # s
    follow_stall_min_speed: 0.03        # m/s
    follow_stall_ratio: 0.2
    follow_stall_timeout: 1.5           # s

    # /motion/follow: jerk-limited shaping of Servo's joint command (Ruckig, core/joint_shaper).
    # Every 10 ms command stays within these limits; one value per joint, fer_joint1..7.
    # off: no shaping (Servo's command as is; write "off" or off). Any other name selects
    # follow_shaping.<name>.
    follow_shaping_profile: conservative
    follow_shaping:
      conservative:                     # velocity and acceleration as joint_limits.yaml
        max_velocity: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]        # rad/s
        max_acceleration: [3.75, 1.875, 2.5, 3.125, 3.75, 5.0, 5.0]         # rad/s², datasheet / 4
        max_jerk: [37.5, 18.75, 25.0, 31.25, 37.5, 50.0, 50.0]              # rad/s³, 10 x acceleration
      max_sim:                          # the FER datasheet
        max_velocity: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]
        max_acceleration: [15.0, 7.5, 10.0, 12.5, 15.0, 20.0, 20.0]
        max_jerk: [7500.0, 3750.0, 5000.0, 6250.0, 7500.0, 10000.0, 10000.0]

    # /motion/follow: posture term. Servo leaves the elbow's swivel (the 7th, spare degree of
    # freedom) free, and over many cycles of a periodic hand it drifts into a singular posture
    # (22 Nov: Servo slowed after ~180 s of sine). This null-space velocity turns the arm back
    # towards follow_posture_rest without moving the TCP. 0 = off (22 Nov, gain 1: no drift in
    # 240 s, tracking and the jump test unchanged).
    follow_posture_gain: 1.0            # 1/s
    follow_posture_max_speed: 0.2       # rad/s, norm of the posture velocity
    follow_posture_rest: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]  # rad, the ready pose

    # /motion/follow: MoveIt Servo, run as a library (adapters/servo_streamer).
    moveit_servo:
      move_group_name: fer_arm
      publish_period: 0.01              # s, one control cycle
      max_expected_latency: 0.1         # s, how far ahead each joint command reaches
      command_in_type: speed_units      # twists in m/s and rad/s
      scale: {linear: 0.25, rotational: 0.8, joint: 0.5}
      incoming_command_timeout: 0.1     # s
      command_out_type: trajectory_msgs/JointTrajectory
      command_out_topic: /effort_trajectory_controller/joint_trajectory
      publish_joint_positions: true
      publish_joint_velocities: false   # true: the JTC rejects every message (non-zero end velocity)
      publish_joint_accelerations: false
      joint_topic: /joint_states
      is_primary_planning_scene_monitor: false
      monitored_planning_scene_topic: /monitored_planning_scene
      use_smoothing: false              # true: the TCP covers only ~57 % of the commanded motion
      check_collisions: true
      collision_check_rate: 10.0        # Hz
      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      joint_limit_margins: [0.12]       # rad
